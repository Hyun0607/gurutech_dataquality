[project]
name = "stdtool"
version = "1.0.0"
description = "표준화 점검 프로그램 (표준구조 매크로 이식 + 고도화)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openpyxl>=3.1,<3.2",
    "pymysql>=1.1,<2",
    "PySide6>=6.7,<6.9",
    "keyring>=25,<26",
    "cryptography>=43",
    "pypdf>=5,<7",
    "olefile>=0.47,<0.48",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.10,<7",
    "pytest>=8",
]

[project.scripts]
stdtool = "stdtool.cli:main"

[project.gui-scripts]
stdtool-gui = "stdtool.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
